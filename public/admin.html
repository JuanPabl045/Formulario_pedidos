<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Molino Viejo</title>
  <meta name="description" content="Panel administrativo para gestionar productos y pedidos.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/site.min.css">
  <meta name="theme-color" content="#C42127">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

  <!-- SECCIÓN LOGIN -->
  <div id="loginSection">
    <div class="login-box container py-5">
      <div class="text-center mb-4">
        <i class="fas fa-lock fa-3x icon-accent"></i>
        <h2 class="mt-3">Panel Admin</h2>
        <p class="text-muted">Molino Viejo</p>
      </div>

      <div class="mb-3">
        <label for="emailLogin" class="form-label">Email:</label>
        <input type="email" id="emailLogin" class="form-control" placeholder="admin@molinoviejo.com">
      </div>

      <div class="mb-3">
        <label for="passwordLogin" class="form-label">Contraseña:</label>
        <input type="password" id="passwordLogin" class="form-control">
      </div>

      <button class="btn btn-primary w-100" onclick="login()">
        <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
      </button>

      <div id="loginError" class="alert alert-danger mt-3 d-none"></div>
    </div>
  </div>

  <!-- PANEL ADMIN -->
  <div id="adminPanel" class="container py-4 d-none">
    <div class="admin-container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h4 mb-0"><i class="fas fa-clipboard-list me-2"></i> Panel de Pedidos</h1>
          <small class="text-muted">Molino Viejo</small>
        </div>
        <div>
          <a href="nosotros.html" class="me-3 text-decoration-none text-dark"><i class="fas fa-home me-1"></i> Inicio</a>
          <a href="catalogo.html" class="me-3 text-decoration-none text-dark"><i class="fas fa-book me-1"></i> Catálogo</a>
          <a href="pedidos.html" class="me-3 text-decoration-none text-dark"><i class="fas fa-shopping-cart me-1"></i> Pedidos</a>
          <button class="btn btn-outline-secondary" onclick="logout()"><i class="fas fa-sign-out-alt me-1"></i> Cerrar Sesión</button>
        </div>
      </div>

      <div class="mb-4">
        <button class="btn btn-success" onclick="exportarExcel()"><i class="fas fa-file-excel me-2"></i> Exportar a Excel</button>
      </div>

      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Productos</th>
              <th>Método Entrega</th>
              <th>Dirección</th>
            </tr>
          </thead>
          <tbody id="tablaPedidos">
            <tr><td colspan="5" class="text-center text-muted">Cargando pedidos...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="row mt-4">
        <div class="col-md-3">
          <div class="p-3 bg-light rounded">
            <div class="h5" id="totalPedidos">0</div>
            <div class="text-muted">Total Pedidos</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="p-3 bg-light rounded">
            <div class="h5" id="pedidosHoy">0</div>
            <div class="text-muted">Hoy</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="p-3 bg-light rounded">
            <div class="h5" id="pedidosDelivery">0</div>
            <div class="text-muted">Delivery</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="p-3 bg-light rounded">
            <div class="h5" id="pedidosTienda">0</div>
            <div class="text-muted">Recojo en Tienda</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- loaders / config -->
  <script src="env-loader.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    // Inicializar Firebase (firebaseConfig proviene de config.js)
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let pedidosData = [];

    function login() {
      const email = document.getElementById('emailLogin').value.trim();
      const password = document.getElementById('passwordLogin').value.trim();
      if (!email || !password) { mostrarError('Ingresa email y contraseña'); return; }
      auth.signInWithEmailAndPassword(email, password).catch(e => mostrarError('Error: ' + e.message));
    }

    function logout() { auth.signOut(); }

    function mostrarError(msg) { const el = document.getElementById('loginError'); el.textContent = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 5000); }

    function cargarPedidos() {
      db.collection('pedidos').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
        pedidosData = [];
        const tbody = document.getElementById('tablaPedidos'); tbody.innerHTML = '';
        if (snapshot.empty) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No hay pedidos aún</td></tr>'; actualizarEstadisticas(); return; }
        snapshot.forEach(doc => {
          const pedido = doc.data(); pedido.id = doc.id; pedidosData.push(pedido);
          const tr = document.createElement('tr');
          const fecha = pedido.timestamp ? pedido.timestamp.toDate() : new Date();
          const fechaStr = fecha.toLocaleString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
          let productosHTML = '';
          if (pedido.productos && Array.isArray(pedido.productos)) pedido.productos.forEach(p => productosHTML += `<div>• ${p.cantidad}x ${p.producto}</div>`);
          const metodoHTML = `<span>${pedido.metodoEntrega || '-'}</span>`;
          const direccionHTML = (pedido.metodoEntrega === 'Delivery') ? (pedido.direccion || '-') : '-';
          tr.innerHTML = `<td>${fechaStr}</td><td><strong>${pedido.nombre}</strong></td><td>${productosHTML}</td><td>${metodoHTML}</td><td>${direccionHTML}</td>`;
          tbody.appendChild(tr);
        });
        actualizarEstadisticas();
      });
    }

    function actualizarEstadisticas() {
      const total = pedidosData.length;
      const hoy = new Date(); hoy.setHours(0,0,0,0);
      const pedidosHoy = pedidosData.filter(p => { const f = p.timestamp ? p.timestamp.toDate() : new Date(); f.setHours(0,0,0,0); return f.getTime() === hoy.getTime(); }).length;
      const delivery = pedidosData.filter(p => p.metodoEntrega === 'Delivery').length;
      const tienda = total - delivery;
      document.getElementById('totalPedidos').textContent = total;
      document.getElementById('pedidosHoy').textContent = pedidosHoy;
      document.getElementById('pedidosDelivery').textContent = delivery;
      document.getElementById('pedidosTienda').textContent = tienda;
    }

    function exportarExcel() {
      if (pedidosData.length === 0) { alert('No hay pedidos para exportar'); return; }
      const excelData = pedidosData.map(p => {
        const fecha = p.timestamp ? p.timestamp.toDate() : new Date();
        let productos = '';
        if (p.productos && Array.isArray(p.productos)) productos = p.productos.map(x => `${x.cantidad}x ${x.producto}`).join(' | ');
        return { Fecha: fecha.toLocaleString('es-PE'), Cliente: p.nombre, Productos: productos, Metodo: p.metodoEntrega, Direccion: p.direccion || '' };
      });
      const wb = XLSX.utils.book_new(); const ws = XLSX.utils.json_to_sheet(excelData); XLSX.utils.book_append_sheet(wb, ws, 'Pedidos'); XLSX.writeFile(wb, `Pedidos_MolinoViejo_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    auth.onAuthStateChanged(user => { if (user) { document.getElementById('loginSection').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; cargarPedidos(); } else { document.getElementById('loginSection').style.display = 'block'; document.getElementById('adminPanel').style.display = 'none'; } });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="site-nav.js"></script>
</body>
</html>
